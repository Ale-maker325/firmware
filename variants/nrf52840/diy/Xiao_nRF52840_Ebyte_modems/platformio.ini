; Собственная среда сборки: Seeed XIAO nRF52840 Plus + модемы Ebyte E22 (SX1262/SX1268)
[env:xiao_nrf52840_plus_ebyte_modems]
extends = nrf52840_base
; Та же плата, что у штатного варианта XIAO: загрузчик XIAO и SoftDevice S140 v7
board = xiao_ble_sense
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/Xiao_nRF52840_Ebyte_modems
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -D PRIVATE_HW
  ; Украинский шрифт OLED (кириллица на экране, раскладка UA клавиатуры)
  -D OLED_UA
  ; Выводы NFC (P0.09 / P0.10 = D14 / D15) работают как обычные GPIO
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  ; Модуль Remote Hardware (управление выводами, например реле на D19, по радиосети) выключен во всём проекте.
  ; Чтобы включить в этой сборке — раскомментировать две строки:
  ; -UMESHTASTIC_EXCLUDE_REMOTEHARDWARE
  ; -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=0
; У XIAO SoftDevice S140 v7 — нужен соответствующий скрипт компоновки (как у штатного варианта XIAO)
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
; Включаем исходники папки варианта в сборку
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/Xiao_nRF52840_Ebyte_modems>
lib_deps =
  ${nrf52840_base.lib_deps}
debug_tool = jlink
