; Тестове середовище: плата ProMicro з модемом Ebyte як вузол керування реле.
; Копія nRF52840_Ebyte_modems без клавіатури і GPS + модуль RelayModule. Основний варіант не змінено.
[env:nrf52_promicro_ebyte_modems_relay]
extends = nrf52840_base
board = promicro-nrf52840

build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nRF52840_Ebyte_modems_relay
  -D NRF52_PROMICRO_DIY
  ; Український шрифт OLED (кирилиця на екрані)
  -D OLED_UA

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nRF52840_Ebyte_modems_relay>

lib_deps =
  ${nrf52840_base.lib_deps}
debug_tool = jlink
