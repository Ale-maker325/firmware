; Seeed Wio Tracker L1 (OLED) з українським шрифтом на екрані.
; Наслідує офіційне середовище seeed_wio_tracker_L1 без змін у його файлах і додає лише OLED_UA.
[env:seeed_wio_tracker_L1_ua]
extends = env:seeed_wio_tracker_L1
build_flags = ${env:seeed_wio_tracker_L1.build_flags}
  ; Український шрифт OLED (кирилиця на екрані)
  -D OLED_UA
